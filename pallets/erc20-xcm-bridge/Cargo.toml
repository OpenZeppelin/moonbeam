[package]
name = "pallet-erc20-xcm-bridge"
authors = ["PureStake"]
edition = "2021"
version = "1.0.0"

[dependencies]
environmental = { version = "1.1.4", default-features = false }
ethereum = { git = "https://github.com/rust-ethereum/ethereum", rev = "3be0d8fd4c2ad1ba216b69ef65b9382612efc8ba", default-features = false, features = ["with-scale"] }
ethereum-types = { version = "0.15.1", default-features = false }
serde = { version = "1.0.197", default-features = false, optional = true, features = ["derive"] }
log = { version = "0.4.21", default-features = false }

# Substrate
frame-support = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
parity-scale-codec = { version = "3.6.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-weights = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }

# Frontier
fp-evm = { git = "https://github.com/OpenZeppelin/frontier", branch = "polkadot-branch-stable2412", default-features = false }
pallet-evm = { git = "https://github.com/OpenZeppelin/frontier", branch = "polkadot-branch-stable2412", default-features = false, features = ["forbid-evm-reentrancy"] }

# Moonbeam
xcm-primitives = { path = "../../primitives/xcm", default-features = false }

#Polkadot / XCM
xcm = { package = "staging-xcm", git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
xcm-executor = { package = "staging-xcm-executor", git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }

[dev-dependencies]
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", features = ["insecure_zero_ed", "std"] }
pallet-timestamp = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", features = ["std"] }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", features = ["std"] }

[features]
default = ["std"]
std = [
    "environmental/std",
    "ethereum/std",
    "ethereum-types/std",
    "fp-evm/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-evm/std",
    "parity-scale-codec/std",
    "scale-info/std",
    "serde",
    "sp-core/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-weights/std",
    "xcm-executor/std",
    "xcm-primitives/std",
    "xcm/std",
]
try-runtime = ["frame-support/try-runtime"]

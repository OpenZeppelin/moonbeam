[package]
name = "pallet-xcm-transactor"
authors = ["PureStake"]
edition = "2021"
version = "0.2.0"

[dependencies]
log = { version = "0.4.21", default-features = false }
serde = { version = "1.0.197", default-features = false }

# Moonbeam
xcm-primitives = { path = "../../primitives/xcm", default-features = false }

# Substrate
frame-support = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
parity-scale-codec = { version = "3.6.5", default-features = false, features = [ "derive" ] }
scale-info = { version = "2.10.0", default-features = false, features = [ "derive" ] }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }

# Cumulus
cumulus-primitives-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }

# Polkadot / XCM
xcm = { package = "staging-xcm", git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
xcm-builder = { package = "staging-xcm-builder", git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }
xcm-executor = { package = "staging-xcm-executor", git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false }

# Benchmarks
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", default-features = false, optional = true }

[dev-dependencies]
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", features = [ "insecure_zero_ed", "std" ] }
pallet-timestamp = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", features = [ "std" ] }
pallet-xcm = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", features = [ "std" ] }
parity-scale-codec = { version = "3.6.5", features = [ "std" ] }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412", features = [ "std" ] }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "stable2412" }

[features]
default = [ "std" ]
std = [
	"cumulus-primitives-core/std",
	"frame-benchmarking/std",
	"frame-support/std",
	"frame-system/std",
	"parity-scale-codec/std",
	"sp-io/std",
	"sp-runtime/std",
	"sp-std/std",
	"xcm-executor/std",
	"xcm-primitives/std",
	"xcm/std",
]
runtime-benchmarks = [
	"frame-benchmarking",
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"xcm-builder/runtime-benchmarks",
	"pallet-xcm/runtime-benchmarks",
	"xcm-primitives/runtime-benchmarks",
]
try-runtime = [ "frame-support/try-runtime" ]
